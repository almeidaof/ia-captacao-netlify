<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste do agente comercial</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d111b;color:#f4f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}main{max-width:750px;margin:auto}header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}h1{font-size:30px;margin-bottom:3px}p{color:#adb5ca}a{color:#cebaff}label{display:block;font-weight:600;margin:20px 0 10px}input,textarea{width:100%;border:1px solid #656d83;border-radius:12px;background:#141a29;color:#fff;padding:13px;font:inherit}textarea{resize:vertical;min-height:85px}button{padding:12px 20px;border:0;border-radius:10px;background:#ac8bff;color:#1b1427;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}button:disabled{opacity:.6}#chat{min-height:250px;max-height:50vh;overflow:auto;background:#171c2a;border:1px solid #353c50;border-radius:16px;padding:17px;margin-top:20px;display:flex;flex-direction:column;gap:10px}.message{max-width:90%;padding:10px 14px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:#303951}.user{align-self:end;background:#57418a}.bot{align-self:start}.nota{font-size:14px}#status{min-height:22px}
</style></head><body><main><header><div><h1>🤖 Testar agente</h1><p>Converse com a IA comercial antes de conectar o Instagram.</p></div><a href="/">← Painel de leads</a></header>
<label for="senha">Senha de administradora</label><input type="password" id="senha" autocomplete="current-password" placeholder="Senha da Netlify">
<section id="chat" role="log" aria-label="Conversa de teste"><div class="message bot">Olá! Este é um teste separado do Instagram e WhatsApp. Envie uma mensagem para começar.</div></section>
<label for="mensagem">Mensagem</label><textarea id="mensagem" maxlength="2000" placeholder="Olá, quero conhecer os cursos..."></textarea><button id="enviar" type="button">Enviar para a IA</button><button id="limpar" type="button">Limpar conversa</button><p id="status" role="status"></p><p class="nota">Nesta página de teste, as mensagens não são salvas como leads. Não use dados pessoais reais durante os testes.</p>
</main><script src="/js/teste.js" defer></script></body></html>
